[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "margin-ta"
version = "3.0.0"
description = "Read-only technical-analysis pipeline ??generate multi-horizon stances with indicator consensus, tiered S/R and market/sector risk dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AhnRyu", email = "ianlyoo@github.com" }]
keywords = ["developer-tools", "indicator-consensus", "market-dashboard", "mcp", "multi-horizon", "python", "quant", "risk-management", "stock-analysis", "support-resistance", "technical-analysis", "trading"]
dependencies = [
  "yfinance>=1.3",
  "pykrx>=1.2",
  "ta>=0.11",
  "TA-Lib>=0.4",
  "tradingview-ta>=3.3",
  "matplotlib>=3.10",
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.28",
  # layer5_output imports rich at module load (margin_ta imports layer5_output),
  # so it is required even for --json runs.
  "rich>=13",
]

[project.optional-dependencies]
# Google Drive upload in scan_nightly (only used when MARGIN_TA_GOOGLE_TOKEN is set)
gdrive = ["google-auth>=2.0", "google-api-python-client>=2.0"]

[project.urls]
Homepage = "https://github.com/ianlyoo/margin-ta"
Repository = "https://github.com/ianlyoo/margin-ta"
Issues = "https://github.com/ianlyoo/margin-ta/issues"
Documentation = "https://ianlyoo.github.io/margin-ta/"

[project.scripts]
margin-ta = "margin_ta:main"
market-risk = "market_risk:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = [
  "config",
  "crypto_ta",
  "download_ohlcv_batch",
  "fred_client",
  "layer1_crypto_market",
  "layer1_data",
  "layer1_flow",
  "layer1_kr_market",
  "layer1_market",
  "layer1_options",
  "layer1_ownership",
  "layer1_risk",
  "layer1_session",
  "layer2_indicators",
  "layer3_consensus",
  "layer3_horizons",
  "layer3_liquidity",
  "layer3_risk",
  "layer3_signals",
  "layer4_pricing",
  "layer5_output",
  "margin_ta",
  "market_risk",
  "quick_crypto_ta",
  "scan_nightly",
  "timeframes",
  "toss_loader",
  "update_market_breadth",
]

[tool.ruff.lint]
# Pre-existing patterns in the pipeline scripts (score/detail one-liners,
# kept imports for the interactive workflow). Ignored repo-wide so CI lints
# new code without rewriting production scripts.
ignore = ["EXE001", 
    "E702", "E741", "E401", "F401", "F541", "F841",
    # pre-existing non-trivial lint (import sorting fixed, rest ignored for CI green)
    "BLE001", "C408", "DTZ003", "DTZ005", "DTZ007", "DTZ011",
    "FURB192", "ISC004", "PERF102", "PERF402", "PLW1510",
    "RUF019", "RUF046", "RUF059", "RUF100", "S110", "S112", "SIM114",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

